[build-system]
requires = ["setuptools>=67.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skinseg-technical-test"
version = "0.1.0"
description = "Skin segmentation using nnU-Net"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "black>=23.0", "ruff>=0.1"]

[tool.setuptools]
packages = ["skinseg_technical_test"]

[tool.setuptools.package-dir]
"" = "src"
